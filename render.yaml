services:
  - type: web
    name: atlas-research-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run web.py --server.port=10000 --server.address=0.0.0.0
    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: false
